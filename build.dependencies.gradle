repositories {
    mavenCentral()
    google() // Needed for androidx

    // Pedro Pathing's tuning library pulls Dairy's class scanner from here.
    maven { url = 'https://repo.dairy.foundation/releases/' }

    // Koala-Log (AdvantageScope .wpilog logging, TeamCode/build.gradle) is built by JitPack straight
    // from its GitHub tag; FTC Dashboard is on Brott's Maven. Koala-Log calls into Dashboard, and its
    // POM does not declare that, so Dashboard is listed by hand next to it.
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // Pedro Pathing 3.0.0 (2026-09-10): revhub carries core; tuning is AutoTune, the robot-hosted
    // tuning page at http://192.168.43.1:10158 (pedropathing/Tuning.java registers our tuners).
    // Migrated from 2.1.2 on 2026-09-15: doc/PEDRO_ON_TEST2027.md sections 6 and 7. Panels is gone.
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation 'com.pedropathing:tuning:1.0.0'
}

